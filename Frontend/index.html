<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IRIS 15: Gửi Ký Ức, Chạm Thanh Âm. Trang kỷ niệm 15 năm ngày thành lập IRIS Corporation. Nơi lưu giữ những khoảnh khắc vàng, những lời chúc thân thương và những câu chuyện Radio AI đầy cảm xúc từ các thế hệ cán bộ nhân viên IRIS." />
    <meta name="theme-color" content="#0B0C0E" id="theme-color-meta" />

    <!-- Anti-FOUC: decide dark/light before CSS loads -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('iris15-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      html.dark { background: #0B0C0E; }
      html:not(.dark) { background: #EDEFF2; }
    </style>

    <!--
      Archivo (hiển thị, có dáng rộng kiểu áp phích in khổ lớn) +
      Be Vietnam Pro (nội dung, thiết kế riêng cho tiếng Việt) +
      IBM Plex Mono (số liệu: chỉ số ô, kích thước, DPI).
      Tải không chặn render: gán media="print" rồi đổi lại khi tệp về, nên mạng
      hội trường chậm cũng không làm trắng trang.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    </noscript>

    <title>IRIS 15: Gửi Ký Ức, Chạm Thanh Âm</title>
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
