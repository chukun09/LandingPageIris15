<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IRIS 15: Gửi Ký Ức, Chạm Thanh Âm. Trang kỷ niệm 15 năm ngày thành lập IRIS Corporation. Nơi lưu giữ những khoảnh khắc vàng, những lời chúc thân thương và những câu chuyện Radio AI đầy cảm xúc từ các thế hệ cán bộ nhân viên IRIS." />
    <meta name="theme-color" content="#0a1128" id="theme-color-meta" />

    <!-- Anti-FOUC: decide dark/light before CSS loads -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('iris15-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      html.dark { background: #0a1128; }
    </style>

    <!-- Google Fonts: Inter (Body), Outfit (Headings), Fira Code (Stats/Dates) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <title>IRIS 15: Gửi Ký Ức, Chạm Thanh Âm</title>
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
