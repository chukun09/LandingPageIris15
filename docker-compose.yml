services:
  web-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TtsSettings__ActiveProvider=Azure
      - TtsSettings__EnableFallbackToAzure=true
    volumes:
      - ./Data:/app/Data
      - ./uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
